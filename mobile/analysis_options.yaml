analyzer:
  errors:
    todo: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - web/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - use_super_parameters
